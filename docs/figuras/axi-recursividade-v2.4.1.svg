<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="510" viewBox="0 0 1020 510" role="img" aria-labelledby="titulo descricao">
<title id="titulo">AXI Pesquisa — Todo, partes, novos todos e reintegração</title><desc id="descricao">Diagrama em árvore da esquerda à direita com cartões: um todo possui duas partes; cada parte torna-se novo todo e abre subpartes. Setas de integração ascendente e descendente fecham o ciclo.</desc>
